<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no">
  <title>Launch Home</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/dock.css">
  <script src="webOS.js"></script>
</head>
<body>
  <div id="app">
    <div id="background-layer" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>
    <div id="dim" aria-hidden="true"></div>
    <!-- Dock home style (dock-style.js): glow in the focused app's colour, two
         layers so colours crossfade, and the focused dock app's name. -->
    <div id="dock-ambient-a" class="dock-ambient" aria-hidden="true"></div>
    <div id="dock-ambient-b" class="dock-ambient" aria-hidden="true"></div>
    <div id="dock-hero" class="dock-hero" aria-hidden="true"></div>

    <header class="top-bar">
      <!-- Dock home style (dock-style.js): the clock, which opens a menu of the
           inputs, Settings and TV Settings. -->
      <button id="dock-menu-btn" class="dock-menu-btn focusable" type="button" data-focus-index="85"
        aria-haspopup="true" aria-expanded="false" aria-label="Inputs and settings">
        <span id="dock-menu-time" class="dock-menu-time"></span>
        <svg class="dock-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="dock-menu" class="dock-menu" role="menu">
        <div id="dock-menu-date" class="dock-menu-date"></div>
        <div class="dock-menu-heading">Inputs</div>
        <div id="dock-menu-inputs" class="dock-menu-inputs"></div>
        <div class="dock-menu-separator"></div>
        <button id="dock-menu-settings" class="dock-menu-row focusable" type="button" data-focus-index="88">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M19 5h2M3 12h4M11 12h10M3 19h10M17 19h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="17" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="9" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="15" cy="19" r="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
          <span>Launch Home settings</span>
        </button>
        <button id="dock-menu-tv" class="dock-menu-row focusable" type="button" data-focus-index="89">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z" fill="currentColor"/></svg>
          <span>TV Settings</span>
        </button>
      </div>
      <section id="weather-panel" class="weather-panel" aria-label="Weather" hidden></section>
      <div class="clock-stack">
        <div id="clock" class="clock"></div>
        <div id="clock-date" class="clock-date"></div>
      </div>
      <div class="top-actions">
        <div id="voice-indicator" class="voice-indicator" hidden aria-hidden="true" role="status" aria-live="polite" aria-label="Listening">
          <span class="voice-indicator-glow" aria-hidden="true"></span>
          <span class="voice-indicator-ai" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.6" opacity="0.9"/>
              <path d="M8.2 13.2c.7 1.5 2.1 2.5 3.8 2.5s3.1-1 3.8-2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="9.2" cy="10.2" r="1.15" fill="currentColor"/>
              <circle cx="14.8" cy="10.2" r="1.15" fill="currentColor"/>
            </svg>
          </span>
          <span class="voice-indicator-mic" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3.5" width="6" height="11" rx="3"/>
              <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0"/>
              <path d="M12 17v3.2"/>
              <path d="M9 20.2h6"/>
            </svg>
          </span>
          <span class="voice-indicator-label">Listening</span>
        </div>
        <button id="app-settings-btn" class="settings-icon focusable" type="button" aria-label="Settings" data-focus-index="90">
          <svg class="settings-icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="launcher">
      <nav id="channel-strip" class="channel-strip" aria-label="TV channels" hidden></nav>
      <nav id="input-row" class="input-row" aria-label="Inputs"></nav>
      <div id="app-grid-shell" class="app-grid-shell">
        <div id="dock-band" class="dock-band" aria-hidden="true"></div>
        <div class="app-scroll-edge app-scroll-edge-left" aria-hidden="true">
          <span class="app-scroll-badge">
            <svg class="app-scroll-chevron-svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <section id="app-grid" class="app-grid" aria-label="Apps"></section>
        <div id="dock-glass" class="dock-glass" aria-hidden="true"></div>
        <div class="app-scroll-edge app-scroll-edge-right" aria-hidden="true">
          <span class="app-scroll-badge">
            <svg class="app-scroll-chevron-svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
      </div>
    </main>

    <footer id="music-bar" class="music-bar">
      <div class="music-meta">
        <span class="music-icon" aria-hidden="true">♪</span>
        <span id="track-title" class="track-title"></span>
      </div>
      <div class="music-controls">
        <button id="mute-btn" type="button" class="mute-btn focusable" data-focus-index="800" aria-label="Mute" aria-pressed="false"></button>
        <input id="volume-slider" class="volume-slider focusable" data-focus-index="801" type="range" min="0" max="50" value="35" aria-label="Ambient volume">
      </div>
    </footer>

    <div id="settings-panel" class="settings-panel" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <audio id="ambient-audio" preload="auto" playsinline webkit-playsinline></audio>

    <!-- In-app screensaver: full-screen slideshow + clock after idle. -->
    <div id="custom-screensaver" class="custom-screensaver" hidden aria-hidden="true" role="dialog" aria-label="Screensaver">
      <div class="custom-screensaver-bg custom-screensaver-bg-a is-front" aria-hidden="true"></div>
      <div class="custom-screensaver-bg custom-screensaver-bg-b is-back" aria-hidden="true"></div>
      <div class="custom-screensaver-scrim" aria-hidden="true"></div>
      <div class="custom-screensaver-clock">
        <div class="custom-screensaver-time"></div>
        <div class="custom-screensaver-date"></div>
      </div>
      <div class="custom-screensaver-hint">Press any button</div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
